# Serves the static export (apps/web/out). Unprivileged: runs as uid 101 on port 8080. Writes only
# to /tmp, so the root filesystem can be read-only when /tmp is a writable mount (an emptyDir).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  access_log /dev/stdout combined;
  sendfile on;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Behind the tunnel and Traefik the Host and port nginx sees are not the public ones, so the
    # /tic-tac-toe -> /tic-tac-toe/ redirect must be relative.
    absolute_redirect off;

    error_page 404 /404.html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Content-hashed file names: safe to cache for a year.
    location /_next/static/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }

    # HTML, RSC payloads (.txt) and unhashed files: always revalidate, so a deploy is seen on reload.
    location / {
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
      try_files $uri $uri/ =404;
    }
  }
}
