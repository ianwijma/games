name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  # preview.yml runs these checks before it builds a preview.
  workflow_call:

concurrency:
  # github.workflow is the caller's name when called, so a preview's checks and the PR's own CI
  # run do not cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history without blobs: turbo needs it to work out what changed.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
