name: Images

# Builds the relay and site images and pushes them to GHCR, only for commits on develop that
# passed CI. Tags: `sha-<short sha>` (immutable; the homelab pins these) and `develop` (moving,
# for humans). There is no `latest`. Deploying is a separate, manual step in the homelab repo,
# because a relay deploy ends every room (see docs/deployment.md).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: images-${{ github.event.workflow_run.head_sha || github.sha }}

permissions:
  contents: read
  packages: write

jobs:
  push:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [games-relay, games-web]
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - run: echo "SHA_SHORT=${SHA::7}" >> "$GITHUB_ENV"
      # Dockerfiles, build args, labels and cache live in the shared action (also used by preview.yml).
      - uses: ./.github/actions/build-image
        with:
          image: ${{ matrix.image }}
          sha: ${{ env.SHA }}
          relay-url: wss://games-relay.wijma.cloud/ws
          tags: |
            sha-${{ env.SHA_SHORT }}
            develop
          token: ${{ secrets.GITHUB_TOKEN }}
