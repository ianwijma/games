name: Images

# Builds the relay and site images and pushes them to GHCR, only for commits on develop that
# passed CI. Tags: `sha-<short sha>` (immutable; the homelab pins these) and `develop` (moving,
# for humans). There is no `latest`. Deploying is a separate, manual step in the homelab repo,
# because a relay deploy disconnects every player for a few seconds (see docs/deployment.md).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: images-${{ github.event.workflow_run.head_sha || github.sha }}

permissions:
  contents: read
  packages: write

jobs:
  push:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: games-relay
            dockerfile: apps/relay/Dockerfile
            description: WebSocket relay for the games site
            build-args: ""
          - image: games-web
            dockerfile: apps/web/Dockerfile
            description: The games site, a static export served by nginx
            # Baked into the static build.
            build-args: NEXT_PUBLIC_RELAY_URL=wss://games-relay.wijma.cloud/ws
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # The cluster is amd64 only; arm64 would mean building Next under QEMU.
      PLATFORMS: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - id: meta
        run: |
          echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ghcr.io/ianwijma/${{ matrix.image }}:sha-${{ steps.meta.outputs.short }}
            ghcr.io/ianwijma/${{ matrix.image }}:develop
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
