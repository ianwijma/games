name: Build image
description: >-
  Build one of the repo's images (games-relay or games-web) from the checked-out source and push
  it to ghcr.io/ianwijma. Used by images.yml (develop), preview.yml (pull request previews) and
  release.yml (releases).
  The caller checks out the commit to build first.

inputs:
  image:
    description: games-relay or games-web
    required: true
  sha:
    description: Full commit SHA being built (the checked-out commit). Goes in the image labels.
    required: true
  tags:
    description: Tags to push, one per line, without the repository (e.g. `sha-abc1234`).
    required: true
  relay-url:
    description: NEXT_PUBLIC_RELAY_URL baked into games-web. Ignored for games-relay.
    required: false
    default: wss://games-relay.wijma.cloud/ws
  labels:
    description: Extra OCI labels, one `key=value` per line.
    required: false
    default: ""
  provenance:
    description: Passed to docker/build-push-action. Empty keeps its default (an attestation).
    required: false
    default: ""
  version:
    description: Release version (e.g. `1.3.0`) for the image's version label. Empty adds no label.
    required: false
    default: ""
  push:
    description: When "false", build the image without logging in or pushing it.
    required: false
    default: "true"
  skip-existing:
    description: When "true", build nothing if every tag already exists in the registry.
    required: false
    default: "false"
  token:
    description: Token that can push to GHCR (GITHUB_TOKEN with packages write).
    required: true

outputs:
  skipped:
    description: '"true" when skip-existing found every tag already pushed.'
    value: ${{ steps.exists.outputs.skipped }}
  digest:
    description: Digest of the pushed image (sha256:...). Empty when nothing was pushed.
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - id: meta
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TAGS: ${{ inputs.tags }}
        RELAY_URL: ${{ inputs.relay-url }}
        VERSION: ${{ inputs.version }}
      run: |
        case "$IMAGE" in
          games-relay)
            dockerfile=apps/relay/Dockerfile
            description="WebSocket relay for the games site"
            build_args="" ;;
          games-web)
            dockerfile=apps/web/Dockerfile
            description="The games site, a static export served by nginx"
            # Baked into the static build.
            build_args="NEXT_PUBLIC_RELAY_URL=$RELAY_URL" ;;
          *) echo "::error::unknown image $IMAGE"; exit 1 ;;
        esac
        {
          echo "dockerfile=$dockerfile"
          echo "description=$description"
          echo "build-args=$build_args"
          echo "created=$(git log -1 --format=%cI)"
          if [ -n "$VERSION" ]; then echo "version-label=org.opencontainers.image.version=$VERSION"; fi
          echo "tags<<EOF"
          while read -r tag; do
            if [ -n "$tag" ]; then echo "ghcr.io/ianwijma/$IMAGE:$tag"; fi
          done <<< "$TAGS"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - if: inputs.push == 'true'
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - id: exists
      shell: bash
      env:
        SKIP_EXISTING: ${{ inputs.skip-existing }}
        PUSH: ${{ inputs.push }}
        REFS: ${{ steps.meta.outputs.tags }}
      run: |
        skipped=false
        if [ "$SKIP_EXISTING" = true ] && [ "$PUSH" = true ]; then
          skipped=true
          while read -r ref; do
            if [ -z "$ref" ]; then continue; fi
            if docker buildx imagetools inspect "$ref" > /dev/null 2>&1; then
              echo "$ref already exists"
            else
              skipped=false
            fi
          done <<< "$REFS"
        fi
        echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
    - if: steps.exists.outputs.skipped != 'true'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - id: build
      if: steps.exists.outputs.skipped != 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ steps.meta.outputs.dockerfile }}
        # The cluster is amd64 only; arm64 would mean building Next under QEMU.
        platforms: linux/amd64
        push: ${{ inputs.push == 'true' }}
        provenance: ${{ inputs.provenance }}
        build-args: ${{ steps.meta.outputs.build-args }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ inputs.sha }}
          org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          org.opencontainers.image.title=${{ inputs.image }}
          org.opencontainers.image.description=${{ steps.meta.outputs.description }}
          ${{ steps.meta.outputs.version-label }}
          ${{ inputs.labels }}
        cache-from: type=gha,scope=${{ inputs.image }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image }}
