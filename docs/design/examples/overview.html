<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design example: overview</title>
<link rel="stylesheet" href="../../../packages/react/src/table.css">
<style>

.box.soon { opacity: 0.6; }
.join { width: min(100%, 400px); }

</style>
</head>
<body>
<header class="bar"><a class="brand" href="overview.html">Games</a><span class="spacer"></span><span class="who">Playing as <strong>Ian</strong></span></header>
<main class="table"><div class="felt">
  <div class="row" style="justify-content:space-between; gap:16px">
    <div><div class="felt-label">Pull up a chair</div><h1 class="felt-title">Pick a game</h1></div>
    <form class="paper slip join row" onsubmit="return false">
      <div class="grow"><label for="code">Have an invite code?</label><input id="code" class="code" placeholder="ABC234" autocomplete="off"></div>
      <button type="button" class="btn primary" style="align-self:flex-end">Join</button>
    </form>
  </div>
  <div class="felt-label">On the table</div>
  <div class="shelf">
    <a class="box" href="lobby.html"><div class="cover" style="--c:#c44a32"><div class="row" style="gap:4px"><div class="card" style="--c:var(--p3);transform:rotate(-10deg)"><span>7</span></div><div class="card" style="--c:var(--p2);transform:rotate(8deg)"><span>2</span></div></div></div><div class="info"><h3>ONO</h3><p>2-12 players · cards</p></div></a>
    <a class="box" href="lobby.html"><div class="cover" style="--c:#3f8fd9"><div class="grid3"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div></div><div class="info"><h3>Tic-tac-toe</h3><p>2 players · quick</p></div></a>
    <a class="box" href="lobby.html"><div class="cover" style="--c:#8a5ad0"><div class="row" style="gap:6px"><div class="token" style="--c:var(--p3)">?</div><div class="token" style="--c:var(--p1)">!</div></div></div><div class="info"><h3>Quiz night</h3><p>2-30 players · phones</p></div></a>
    <div class="box soon"><div class="cover" style="--c:#2f8f63"><div class="token" style="--c:#fff;color:#2f8f63">◎</div></div><div class="info"><h3>Soap Tank</h3><p>Coming later</p></div></div>
  </div>
</div></main>
</body></html>
