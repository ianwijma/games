<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design example: Ohno! cards</title>
<link rel="stylesheet" href="../../../packages/react/src/table.css">
<style>
.felt { gap: 22px; }
.ono { flex: none; width: var(--card-w, 100px); height: auto; border-radius: calc(var(--card-w, 100px) * 0.1); box-shadow: var(--lift-1); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.row.small { --card-w: clamp(52px, 14vw, 70px); gap: 8px; }
.row.hand { --card-w: 78px; flex-wrap: nowrap; gap: 0; overflow-x: auto; padding: 6px 4px 10px; scrollbar-width: none; }
.row.hand .ono + .ono { margin-left: -48px; }
.row.backs { display: inline-flex; } .row.backs .ono + .ono { margin-left: -60px; }
figure { margin: 0; display: grid; justify-items: center; gap: 8px; }
.figures { display: flex; flex-wrap: wrap; gap: 16px 18px; align-items: flex-end; }
@media (max-width: 560px) { .row, .figures { --card-w: 74px; gap: 12px 10px; } }
</style>
</head>
